</g>
<text x="120" y="565" font-size="20" font-weight="700" fill="#0f172a">Options</text>
<g font-size="16" fill="#334155">
<text x="130" y="600">☑ Import images to Media Library</text><text x="500" y="600">☑ Preserve CSS</text>
<text x="130" y="632">☑ Mirror/load local JavaScript</text><text x="500" y="632">☑ Mirror assets/chunks/fonts</text>
<text x="130" y="664">☐ External/CDN JavaScript</text><text x="500" y="664">☐ Set root index as homepage</text>
<text x="130" y="696">☑ Create/update Navigation</text><text x="500" y="696">☑ Import header/footer parts</text>
<rect x="118" y="718" width="700" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="134" y="747" fill="#9a3412">☐ Apply imported header/footer/navigation/homepage to active site</text>
</g>
<rect x="120" y="782" width="238" height="44" rx="8" fill="#2563eb"/><text x="143" y="811" font-size="18" font-weight="700" fill="white">Import GitHub Website</text>
<g>
<circle cx="950" cy="222" r="25" fill="#2563eb"/><text x="943" y="231" font-size="24" font-weight="700" fill="white">1</text><text x="990" y="227" font-size="18" fill="#0f172a">Repository URL</text>
<circle cx="950" cy="283" r="25" fill="#2563eb"/><text x="943" y="292" font-size="24" font-weight="700" fill="white">2</text><text x="990" y="288" font-size="18" fill="#0f172a">Exact branch</text>
<circle cx="950" cy="344" r="25" fill="#2563eb"/><text x="943" y="353" font-size="24" font-weight="700" fill="white">3</text><text x="990" y="349" font-size="18" fill="#0f172a">Build folder</text>
<circle cx="950" cy="405" r="25" fill="#2563eb"/><text x="943" y="414" font-size="24" font-weight="700" fill="white">4</text><text x="990" y="410" font-size="18" fill="#0f172a">Import mode</text>
<circle cx="950" cy="466" r="25" fill="#7c3aed"/><text x="943" y="475" font-size="24" font-weight="700" fill="white">5</text><text x="990" y="471" font-size="18" fill="#0f172a">🔒 Token if needed</text>
<circle cx="950" cy="527" r="25" fill="#16a34a"/><text x="943" y="536" font-size="24" font-weight="700" fill="white">6</text><text x="990" y="532" font-size="18" fill="#0f172a">Start as Draft</text>
<rect x="930" y="590" width="285" height="176" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="953" y="625" font-size="19" font-weight="700" fill="#9a3412">⚠ Live-site gate</text>
<text x="953" y="658" font-size="16" fill="#9a3412">“Apply imported…” only takes</text>
<text x="953" y="684" font-size="16" fill="#9a3412">effect with Published pages.</text>
<text x="953" y="720" font-size="16" fill="#9a3412">Review in staging first.</text>
</g></g></svg>