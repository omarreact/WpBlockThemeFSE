<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<rect width="1280" height="900" rx="28" fill="#f1f5f9"/>
<rect x="40" y="30" width="1200" height="78" rx="18" fill="#111827"/>
<text x="72" y="80" font-family="Arial" font-size="30" font-weight="700" fill="white">Tools → PIN Site Importer — annotated form</text>
<g font-family="Arial">
<rect x="80" y="135" width="820" height="690" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="115" y="180" font-size="26" font-weight="700" fill="#0f172a">PIN Site Importer</text>
<g font-size="18" fill="#0f172a">
<text x="120" y="228">GitHub repository</text><rect x="330" y="205" width="520" height="38" rx="6" fill="#fff" stroke="#94a3b8"/><text x="350" y="231" fill="#64748b">https://github.com/owner/repository</text>
<text x="120" y="285">Branch</text><rect x="330" y="262" width="520" height="38" rx="6" fill="#fff" stroke="#94a3b8"/><text x="350" y="288" fill="#64748b">Default branch / main</text>
<text x="120" y="342">Static build folder</text><rect x="330" y="319" width="520" height="38" rx="6" fill="#fff" stroke="#94a3b8"/><text x="350" y="345" fill="#64748b">out or dist</text>
<text x="120" y="399">Source format</text><rect x="330" y="376" width="520" height="38" rx="6" fill="#fff" stroke="#94a3b8"/><text x="350" y="402" fill="#334155">Auto: JSON → WXR/XML → HTML</text>
<text x="120" y="456">GitHub token</text><rect x="330" y="433" width="520" height="38" rx="6" fill="#fff" stroke="#94a3b8"/><text x="350" y="459" fill="#64748b">••••••••••••••  (optional)</text>
