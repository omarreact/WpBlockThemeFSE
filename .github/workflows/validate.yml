name: Theme and companion plugin validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON
        run: |
          python -m json.tool theme.json >/dev/null
          find styles -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool

      - name: Validate Structured Build tooling
        run: |
          python -m py_compile scripts/build-structured-site.py tests/test-structured-build.py
          python tests/test-structured-build.py

      - name: Verify required theme and plugin files
        run: |
          test -f style.css
          test -f theme.json
          test -f templates/index.html
          test -f plugin/pin-site-importer/pin-site-importer.php
          test -f plugin/pin-site-importer/includes/class-pin-github-client.php
          test -f plugin/pin-site-importer/includes/class-pin-asset-manager.php
          test -f plugin/pin-site-importer/includes/class-pin-html-to-blocks.php
          test -f plugin/pin-site-importer/includes/class-pin-structured-source.php
          test -f plugin/pin-site-importer/includes/class-pin-importer.php
          test -f plugin/pin-site-importer/includes/class-pin-admin.php
          test -f inc/companion-plugin-installer.php
          test -f scripts/build-structured-site.py
          test -f scripts/structured-theme-runtime.php
          test -f tests/wp-structured-build.php
          test -f tests/test-structured-build.py
          test -f docs/structured-build-mode.md

      - name: Verify release versions
        run: |
          grep -q "Version: 0.4.1" style.css
          grep -q "Version: 0.4.1" plugin/pin-site-importer/pin-site-importer.php

  structured-build-meta-gray-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PIN Universal FSE
        uses: actions/checkout@v5

      - name: Checkout real Meta Grey Label structured source
        uses: actions/checkout@v5
        with:
          repository: omarreact/meta-gray-label
          ref: e34ac92505549348ac4e73009d6a0805a736da53
          path: build-source/meta-gray-label

      - name: Build deterministic Meta Grey Label WordPress artifacts
        run: python scripts/build-structured-site.py --source-root build-source/meta-gray-label --out-dir build/meta-gray-label

      - name: Verify 52-page real-source artifact
        run: python scripts/verify-structured-build.py build/meta-gray-label --expected-pages 52 --expected-theme pin-site-meta-grey-label

      - name: Upload real-source Structured Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-gray-label-structured-build
          path: |
            build/meta-gray-label/website.xml
            build/meta-gray-label/pin-site-meta-grey-label.zip
            build/meta-gray-label/pin-site-meta-grey-label/build-report.json
          if-no-files-found: error

  wordpress-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout real Meta Grey Label structured source
        uses: actions/checkout@v5
        with:
          repository: omarreact/meta-gray-label
          ref: e34ac92505549348ac4e73009d6a0805a736da53
          path: build-source/meta-gray-label

      - name: Build real Structured Build artifact for WordPress integration
        run: python scripts/build-structured-site.py --source-root build-source/meta-gray-label --out-dir build/meta-gray-label

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install wp-env
        run: npm install --global @wordpress/env@10.0.2

      - name: Start WordPress
        run: wp-env start

      - name: Activate theme
        run: wp-env run cli wp theme activate pin-universal-fse

      - name: Trigger bundled companion installation
        run: |
          wp-env run cli wp eval 'wp_set_current_user(1); do_action("admin_init");'

      - name: Diagnose companion installation
        run: |
          wp-env run cli wp eval 'wp_set_current_user(1); echo "can_install=" . ( current_user_can("install_plugins") ? "yes" : "no" ) . PHP_EOL; echo "can_activate=" . ( current_user_can("activate_plugins") ? "yes" : "no" ) . PHP_EOL; echo "pending=" . get_option("pin_universal_fse_companion_install_pending", "none") . PHP_EOL; echo "error=" . get_option("pin_universal_fse_companion_install_error", "none") . PHP_EOL; echo "source=" . ( file_exists( get_template_directory() . "/plugin/pin-site-importer/pin-site-importer.php" ) ? "yes" : "no" ) . PHP_EOL; echo "target=" . ( file_exists( WP_PLUGIN_DIR . "/pin-site-importer/pin-site-importer.php" ) ? "yes" : "no" ) . PHP_EOL;'
          wp-env run cli wp plugin list

      - name: Verify companion plugin
        run: wp-env run cli wp plugin is-active pin-site-importer

      - name: Configure end-to-end GitHub fixture
        env:
          PIN_SMOKE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          wp-env run cli wp option update pin_smoke_source_repo "https://github.com/${GITHUB_REPOSITORY}"
          wp-env run cli wp option update pin_smoke_source_branch "${SOURCE_BRANCH}"
          wp-env run cli wp option update pin_smoke_github_token "${PIN_SMOKE_GITHUB_TOKEN}"

      - name: Run WordPress smoke test
        run: wp-env run cli wp eval-file wp-content/themes/pin-universal-fse/tests/wp-smoke.php

      - name: Import real Structured Build WXR into fresh WordPress state
        run: |
          wp-env run cli wp eval 'foreach ( get_posts( array( "post_type" => "page", "post_status" => "any", "numberposts" => -1, "fields" => "ids" ) ) as $id ) { wp_delete_post( (int) $id, true ); }'
          wp-env run cli wp theme install /var/www/html/wp-content/themes/pin-universal-fse/build/meta-gray-label/pin-site-meta-grey-label.zip --force --activate
          wp-env run cli wp plugin install wordpress-importer --activate
          wp-env run cli wp import /var/www/html/wp-content/themes/pin-universal-fse/build/meta-gray-label/website.xml --authors=create
          wp-env run cli wp eval '$pages = get_posts( array( "post_type" => "page", "post_status" => "publish", "numberposts" => -1, "fields" => "ids" ) ); if ( 52 !== count( $pages ) ) { throw new Exception( "Expected 52 published pages; got " . count( $pages ) ); } $home = get_page_by_path( "home", OBJECT, "page" ); if ( ! $home ) { throw new Exception( "Generated Home page missing after WXR import." ); } update_option( "show_on_front", "page" ); update_option( "page_on_front", (int) $home->ID ); global $wp_rewrite; $wp_rewrite->set_permalink_structure( "/%postname%/" ); $wp_rewrite->flush_rules( true ); echo "structured-pages=52 home=" . $home->ID . PHP_EOL;'
          wp-env run cli wp theme status pin-site-meta-grey-label
          curl --fail --silent --show-error http://localhost:8888/ > /tmp/pin-structured-home.html
          grep -q 'wp-content/themes/pin-site-meta-grey-label/source/' /tmp/pin-structured-home.html
          if grep -q 'pin-site-importer/' /tmp/pin-structured-home.html; then
            echo "Structured Build homepage must not depend on PIN Site Importer upload paths."
            exit 1
          fi

      - name: Validate generated frontend and editor behavior
        run: wp-env run cli wp eval-file wp-content/themes/pin-universal-fse/tests/wp-structured-build.php

      - name: Export generated block content and core script dependencies
        run: wp-env run cli wp eval-file wp-content/themes/pin-universal-fse/tests/gutenberg/export-input.php

      - name: Verify Gutenberg save compatibility
        run: |
          npm ci --prefix tests/gutenberg --ignore-scripts --no-fund --no-audit
          node tests/gutenberg/validate.cjs build/gutenberg-input.json

      - name: Stop WordPress
        if: always()
        run: command -v wp-env >/dev/null 2>&1 && wp-env stop || true


  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - validate
      - wordpress-integration
      - structured-build-meta-gray-label
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build installable theme ZIP
        run: bash scripts/package-theme.sh

      - name: Verify package contents
        run: |
          test -f dist/pin-universal-fse.zip
          test -f dist/pin-site-importer.zip
          unzip -l dist/pin-universal-fse.zip | grep -q 'pin-universal-fse/style.css'
          unzip -l dist/pin-universal-fse.zip | grep -q 'pin-universal-fse/plugin/pin-site-importer/pin-site-importer.php'
          unzip -l dist/pin-universal-fse.zip | grep -q 'pin-universal-fse/bundled/pin-site-importer.zip'
          unzip -l dist/pin-site-importer.zip | grep -q 'pin-site-importer/pin-site-importer.php'
          if unzip -l dist/pin-universal-fse.zip | grep -q 'pin-universal-fse/tests/'; then
            echo "Development tests must not ship in the installable theme package."
            exit 1
          fi

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: pin-universal-fse
          path: |
            dist/pin-universal-fse.zip
            dist/pin-site-importer.zip
          if-no-files-found: error

      - name: Publish verified package branch
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && 'distribution-rc' || 'distribution' }}
        run: |
          TMP_DIR="$(mktemp -d)"
          cp dist/pin-universal-fse.zip "$TMP_DIR/"
          cp dist/pin-site-importer.zip "$TMP_DIR/"
          printf '%s\n' "${GITHUB_SHA}" > "$TMP_DIR/SOURCE_SHA"
          printf '%s\n' "${GITHUB_REF_NAME}" > "$TMP_DIR/SOURCE_REF"
          cd "$TMP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan package
          git add .
          git commit -m "Publish verified WordPress packages"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:"${TARGET_BRANCH}"
