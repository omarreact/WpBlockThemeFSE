services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-test
      MARIADB_ROOT_PASSWORD: root-test
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.5-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8888:80'
    environment: &wordpress_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
    volumes: &wordpress_volumes
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/themes/pin-universal-fse
  cli:
    image: wordpress:cli-2.12.0-php8.3
    user: '0:0'
    entrypoint: [wp, --allow-root]
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress_env
    volumes: *wordpress_volumes
volumes:
  wordpress:
  database:
